# Site identity and presentation.
#
# Copy this file to site.yaml and make it yours - publish.sh does that for you
# on first run if site.yaml is missing. Your site.yaml is gitignored, the same
# way VOICE.md and publish.local.sh are, so the engine stays reusable and your
# identity is not something a fork inherits by accident.
#
# Everything reader-facing that names you or your site lives here. Nothing in
# engine/*.py or engine/templates/base.html hardcodes it - which matters most
# for the values you cannot see in a browser, like the JSON-LD author and the
# og:image:alt text that search engines and social scrapers actually read.

site:
  # Shown in the header, the browser tab, both RSS feeds, and og:site_name.
  name: "Example Unprompted"

  # Optional. A second line under the site name. Setting it switches the header
  # to its two-tier form - a masthead band carrying the name and this line,
  # above the menu row, which stays stuck to the top as the band scrolls away.
  # Leave it out for the compact single-row header.
  # tagline: "Notes on things I build."

  # Optional. The language the site is written in, as a BCP 47 tag ("en",
  # "de", "en-GB"). Defaults to English, which is what every site.yaml written
  # before this key existed means.
  #
  # Not decoration: it sets <html lang>, which tells a screen reader how to
  # pronounce the page, it sets <language> in the feed, and it decides which
  # language the engine writes alt text in. Alt text in the wrong language is
  # announced with the wrong phonetics, which is worse than terse alt text in
  # the right one.
  # language: "de"

  # Canonical base URL. No trailing slash. Every internal link, the sitemap,
  # both feeds, and the announcement toot are built from this, so it must match
  # where the site is really served or links will point at the wrong host.
  url: "https://blog.example.com"

  # Meta description for the homepage and tag pages.
  description: "Personal thoughts, essays, and notes."

  # Description for the site-wide RSS feed. Usually a slightly fuller version
  # of the above - it is read in feed readers, away from the site's own design.
  feed_description: "Personal thoughts, essays, and notes."

author:
  # Used for the JSON-LD BlogPosting author on every article. This is the field
  # search engines attribute the writing to, so it is the one most worth
  # changing and the easiest to forget - it never appears on screen.
  name: "Your Name"

  # Linked from the "Contact" item in the header.
  email: "you@example.com"

links:
  # The header's "About" link. Anything you want: a LinkedIn profile, an
  # about page on this site, a personal homepage.
  about: "https://example.com/about"

  # --- Mastodon (both optional) ---
  # Only needed if you announce on Mastodon. Omit both and the header link and
  # the fediverse:creator meta are not rendered at all - which is what a site
  # that announces nowhere and carries no comment thread wants.

  # The header's "Mastodon" link. Rendered with rel="me", which is what lets
  # your Mastodon profile verify the link back to this site.
  mastodon: "https://mastodon.social/@example"

  # Sets <meta name="fediverse:creator">, which makes Mastodon show your handle
  # on link previews of your posts. Handle form, not a URL. Also used to badge
  # your own replies as OP in the comment thread.
  fediverse_creator: "@example@mastodon.social"

  # --- Bluesky (both optional) ---
  # Replies from Mastodon and Bluesky are blended into one comment thread, so
  # these are only needed if you announce on Bluesky too. Both may be omitted
  # entirely: a site.yaml written before Bluesky support keeps working unchanged.

  # The header's "Bluesky" link. Omit it and no link is rendered at all.
  # Rendered with rel="me", the counterpart of the Mastodon link above.
  # bluesky: "https://bsky.app/profile/example.bsky.social"

  # Your Bluesky handle or DID, used to badge your own replies as OP.
  # The counterpart of fediverse_creator. A handle is fine; a DID
  # ("did:plc:...") is stabler if you ever rename.
  # bluesky_creator: "example.bsky.social"


# --- Header menu -------------------------------------------------------------
# Optional. Without it the header carries the engine's built-in list - About,
# whichever of the two social links above are set, and Contact - which is what
# every site.yaml written before this section existed keeps.
#
# Setting it replaces that list with your own. The RSS link, the search box and
# the theme toggle are engine furniture and appear either way.
#
# Each entry needs a `label` plus an `href`, `items`, or both:
#   href only   - a plain link.
#   items only  - a grouping label that opens a submenu but links nowhere
#                 itself. Rendered as text, not as a link to '#'.
#   both        - a link that also opens a submenu, for a section with a
#                 landing page of its own.
#
# Submenus are one level deep. Off-site links open in a new tab automatically.
# They appear on hover and on keyboard focus, with no JavaScript; on narrow
# screens they sit inline and permanently open, because a hover target cannot
# be reached by a finger.
#
# nav:
#   - label: "Home"
#     href: "/"
#   - label: "Projects"
#     href: "/projects.html"
#     items:
#       - label: "Something I built"
#         href: "https://example.com/thing"
#       - label: "Another thing"
#         href: "https://example.com/other"
#   - label: "Elsewhere"
#     items:
#       - label: "Mastodon"
#         href: "https://mastodon.social/@example"



# --- Podcast (wholly optional) -----------------------------------------------
# Leave this section out entirely and the engine publishes text exactly as
# before: no podcast feed, no /podcast.html, no player.
#
# Add it and any post that links an audio file on a line of its own becomes an
# episode - the file is copied into public/audio/, the link becomes a player,
# and the episode joins /podcast.xml. A post that links audio but should NOT be
# an episode sets `podcast: false` in its own frontmatter.
#
# Unlike the rest of this file, every key here is validated hard. A blog with a
# bad setting renders wrong and you notice; a podcast with a bad setting builds
# a feed that looks fine and is rejected by Apple days later, or accepted with
# the wrong owner - at which point you cannot claim your own show.
#
# podcast:
#   # Shown in directories and in the button. Often the same as site.name, but
#   # it does not have to be - a blog can host a show with its own identity.
#   title: "Example Podcast"
#
#   # One line under the title. Optional.
#   subtitle: "Two people talking about one thing."
#
#   # What the show is. This is the text every podcast app displays.
#   description: >
#     A longer description of the show, a paragraph or two. Plain text.
#
#   # Cover art: root-absolute path to a file this site serves, so put it in
#   # public_static/. Apple wants square, 1400-3000px, JPEG or PNG - a smaller
#   # or non-square image is rejected silently at submission.
#   cover: "/podcast-cover.png"
#
#   # One of Apple's top-level categories, spelled exactly as they spell it.
#   # The engine refuses to build on a typo and prints the valid list.
#   category: "Technology"
#   # subcategory: "Technology"
#
#   # Required by Apple - a feed without it is rejected.
#   explicit: false
#
#   # 'episodic' (newest first, the usual) or 'serial' (meant to be heard in
#   # order from episode 1).
#   type: episodic
#
#   # These four default to the blog's own values above; set them only if the
#   # show differs. owner_email is what Apple mails to verify you own the show,
#   # so it must be an address you can read.
#   # author: "Example Author"
#   # owner_name: "Example Author"
#   # owner_email: "you@example.com"
#   # language: "en"
#   # copyright: "© 2026 Example Author"
#
#   # Fill colour for the Podlove subscribe button. It renders in an iframe and
#   # cannot see the theme's CSS, so this repeats the accent from style.css -
#   # change both together if you change either.
#   # button_color: "#0C7C74"
#
#   # Make the show the site's front page. '/' becomes the episode list and the
#   # written archive moves to /articles.html, carrying only the posts that are
#   # NOT episodes - for a site that is a podcast first and a blog second, which
#   # is a different thing from a blog that happens to have a podcast.
#   # /podcast.html is then not generated at all and 301s to '/'.
#   # homepage: true
#
#   # <podcast:locked> - 'true' (the default) stops a hosting platform importing
#   # this feed and claiming the show as theirs.
#   # locked: true
#
#   # The show's <podcast:guid>. Leave it out for a new podcast and the engine
#   # derives one from the feed URL. Set it when MIGRATING a show that already
#   # published one: the spec says this identifier must not change when a feed
#   # moves, so deriving a new one would make every directory following Podcast
#   # Index treat this as a different show.
#   # guid: "54e71306-4546-4161-892a-902dc00d0bd2"
#
#   # Set ONLY while moving the show to a new feed URL: every subscribed app
#   # follows it permanently, so a stray value hands your audience away.
#   # new_feed_url: "https://example.com/podcast.xml"
#
#   # Directory links, shown as plain pills beside the subscribe button. Any
#   # name works; it is title-cased for the label.
#   # links:
#   #   apple: "https://podcasts.apple.com/..."
#   #   spotify: "https://open.spotify.com/show/..."
#   #   fyyd: "https://fyyd.de/podcast/..."


# --- Redirects (optional) ----------------------------------------------------
# Old path -> new path, emitted as 301s at the top of the generated .htaccess.
# A list of single-key pairs rather than one mapping, because the order Apache
# applies them in matters and YAML mappings do not promise to keep theirs.
#
# This is for migrations. Moving a site onto this engine changes its URL shape,
# and the URL that absolutely must not 404 afterwards is the podcast feed: it
# lives in every subscriber's app and every directory listing, and nobody
# re-subscribes. Sources match as prefixes, so '/feed/mp3/' also catches
# '/feed/mp3/index.xml'.
#
# redirects:
#   - "/feed/mp3/": "/podcast.xml"
#   - "/feed/": "/feed.xml"

footer:
  # The AI transparency label and its explanation. Set label to an empty string
  # if you would rather not display one; to change the footer's markup itself,
  # edit engine/templates/base.html.
  ai_label: "AI Transparency Label: EP-SN-IH-TN"
  ai_explainer: "Everything ideated and originally written by yours truly, LLM used for engine development and text refinement."
  ai_explainer_url: "https://have-a-look.at/aitags"

display:
  # Posts per page on the homepage and on each tag page.
  page_size: 20

  # How many recent posts each RSS feed carries (site-wide and per tag). Feeds
  # are full-content, so a large number here makes for a large feed file.
  feed_items: 15

  # Topic pills shown before the "Show more topics..." fold on the homepage.
  visible_tags: 10

  # Optional. The heading over the written archive - "Latest Stories" on a
  # normal site, "Articles" when the podcast has taken over the front page.
  # Worth setting if your site is not in English and that heading is one of the
  # few strings a reader actually reads. It is not an i18n system: the rest of
  # the chrome is still English.
  # archive_heading: "Artikel"

  # Reading speed used for the "N min read" estimate. 200-250 is the usual
  # range for online prose; 225 keeps estimates from feeling rushed.
  words_per_minute: 225

  # Optional: an emoji shown beside a tag, so a reader can see at a glance what
  # an article is about. Purely decorative - the emoji is NOT part of the tag,
  # so slugs, feeds, the search index and the tag ledger are unaffected, and
  # deleting a line here just removes the decoration.
  #
  # Matching is case-insensitive on the whole tag name, so list each tag you
  # want decorated. Tags with no entry simply render without one.
  # tag_emoji:
  #   Photography: "📷"
  #   "Infrared Photography": "📷"
  #   "AI Ethics": "⚖️"


# --- Images -----------------------------------------------------------------
# Optional. The build re-encodes oversized photographs so a post is not tens of
# megabytes; leave the whole section out to accept the defaults shown here.
#
# Only images that look photographic, are fully opaque, and are larger than
# min_bytes are ever converted - screenshots, diagrams, logos and anything with
# transparency are left exactly as exported. A converted image is written
# alongside its original, which stays on disk in content_pipeline/content/assets/
# unreferenced, so nothing is lost. The one destructive case is downscaling an
# oversized JPEG, which rewrites that file in place - set max_width: 0 if
# content_pipeline/content/assets/ is your only copy of a photo.
images:
  # Widest stored copy, in pixels. The text column is ~760px, so 1600 still
  # covers a 2x display. Set to 0 to never downscale (conversion still runs).
  max_width: 1600

  # JPEG quality for converted photographs. 82 is visually indistinguishable
  # from the original at normal viewing sizes; above ~90 the files grow fast
  # for no visible gain.
  jpeg_quality: 82

  # Files smaller than this (bytes) are left alone - not worth trading a
  # lossless original for a lossy one to save a few kilobytes.
  min_bytes: 200000
