<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The writing-hand emoji (U+270D) from Noto Color Emoji, embedded as
       artwork instead of a font glyph. The old favicon rendered this same
       character via <text>, which WebKit does not draw inside an SVG
       data-URI - hence the blank tab on iOS. Noto emoji artwork is
       licensed Apache-2.0 by Google. -->
  <image width="128" height="128" href="data:image/png;base64,"/>
</svg>
